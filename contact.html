<body>
<header><div class="wrap bar">
  <a class="brand" href="index.html">Madrasa Al-Noor</a>
  <nav aria-label="Main"><a href="about.html">About</a><a href="programs.html">Programs</a><a href="admissions.html">Admissions</a><a href="contact.html" aria-current="page">Contact</a></nav>
</div></header>

<main>
<div class="page-title"><div class="wrap"><h1>Contact</h1><p>Walk-ins are welcome during office hours.</p></div></div>

<section><div class="wrap split">
  <div>
    <h2>Visit us</h2>
    <dl>
      <dt>Address</dt><dd>12 Masjid Road, Your City</dd>
      <dt>Phone</dt><dd><a href="tel:+10000000000">+1 000 000 0000</a></dd>
      <dt>Email</dt><dd><a href="mailto:admissions@example.org">admissions@example.org</a></dd>
      <dt>Hours</dt><dd>Sat to Thu, 9:00 am to 5:00 pm</dd>
    </dl>
  </div>
  <div>
    <h2>Send an enquiry</h2>
    <form action="mailto:admissions@example.org" method="post" enctype="text/plain">
      <label>Parent or guardian name<input name="name" required></label>
      <label>Phone or email<input name="contact" required></label>
      <label>Program
        <select name="program">
          <option>Nazra and Tajweed</option><option>Hifz</option><option>Islamic Studies</option><option>Arabic Language</option><option>Adult Evening Classes</option><option>all</option>
        </select>
      </label>
      <label>Student's age<input name="age" inputmode="numeric"></label>
      <label>Message<textarea name="message"></textarea></label>
      <button class="btn" type="submit">Send enquiry</button>
    </form>
  </div>
</div></section>
</main>
